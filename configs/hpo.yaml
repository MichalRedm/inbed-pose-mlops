# configs/hpo.yaml - Optuna Hyperparameter Optimization Configuration

study:
  name: "inbed-pose-optuna-study"
  direction: "maximize"
  monitor: "val_pck"
  n_trials: 20
  storage: "sqlite:///optuna_study.db"
  load_if_exists: true

pruning:
  enabled: true
  n_warmup_steps: 3
  interval_steps: 1

search_space:
  lr:
    type: "float"
    low: 1.0e-4
    high: 3.0e-3
    log: true
  weight_decay:
    type: "float"
    low: 1.0e-5
    high: 1.0e-3
    log: true
  sigma:
    type: "float"
    low: 1.5
    high: 3.5
    step: 0.5
  loss_type:
    type: "categorical"
    choices:
      - "mse"
      - "smooth_l1"
  optimizer:
    type: "categorical"
    choices:
      - "adamw"
      - "adam"
  lr_scheduler:
    type: "categorical"
    choices:
      - "cosine"
      - "plateau"
  batch_size:
    type: "categorical"
    choices:
      - 8
      - 16

semi_supervised_space:
  conf_threshold:
    type: "float"
    low: 0.25
    high: 0.55
    step: 0.05
  lambda_unlabeled:
    type: "float"
    low: 0.2
    high: 2.0
    step: 0.2
  ema_alpha:
    type: "categorical"
    choices:
      - 0.99
      - 0.999
      - 0.9999

base_config: "configs/baseline.yaml"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "inbed-pose-hpo"
